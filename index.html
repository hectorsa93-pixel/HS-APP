<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS | Boutique & Co. Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <div id="splash-screen">
        <div class="logo-box"><div class="logo-text">HS</div></div>
        <div class="logo-subtitle" style="color: white;">Boutique & Co.</div>
    </div>

    <main id="home-screen" class="v-center">
        <div class="logo-container">
            <div class="logo-box"><div class="logo-text">HS</div></div>
            <div class="logo-subtitle">Boutique & Co.</div>
        </div>
        <div class="menu-actions">
            <button class="btn-main" onclick="navegar('registro')">Alta de Venta</button>
            <button class="btn-main" onclick="navegar('abonos')">Abonos</button>
            <button class="btn-main" onclick="navegar('consulta')">Registros</button>
        </div>
    </main>

    <div class="overlay" id="overlay" onclick="cerrarModal()"></div>
    <div class="modal-edit" id="modalEdit">
        <h2 class="title-serif">Editar Registro</h2>
        <input type="hidden" id="edit-id">
        <div class="form-group"><label>Cliente</label><input type="text" id="edit-cliente"></div>
        <div class="form-group"><label>Producto</label><input type="text" id="edit-producto"></div>
        <div class="grid-2">
            <div class="form-group"><label>Fecha</label><input type="date" id="edit-fecha"></div>
            <div class="form-group"><label>Total</label><input type="number" id="edit-costo" step="0.01"></div>
        </div>
        <button class="btn-main btn-success" style="width:100%;" onclick="guardarCambios()">Guardar Cambios</button>
    </div>

    <section id="panel-registro" class="app-panel">
        <div class="header-app"><span>NUEVA VENTA</span><button class="btn-main btn-back" onclick="navegar('home')">Regresar</button></div>
        <div class="card">
            <form id="formVenta">
                <div class="form-group"><label>Cliente</label><input type="text" id="v-cliente" placeholder="Nombre completo" required></div>
                <div class="grid-2">
                    <div class="form-group"><label>Fecha</label><input type="date" id="v-fecha" required></div>
                    <div class="form-group"><label>Total ($)</label><input type="number" id="v-costo" step="0.01" required></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>Producto</label><select id="v-producto"><option value="Bolsa">Bolsa</option><option value="Perfume">Perfume</option><option value="Ropa">Ropa</option><option value="Tenis">Tenis</option></select></div>
                    <div class="form-group"><label>Plan de Pagos</label><select id="v-plan"><option value="1">Contado</option><option value="2">2 Quincenas</option><option value="4">4 Quincenas</option><option value="6">6 Quincenas</option></select></div>
                </div>
                <button type="submit" class="btn-main btn-success" style="width:100%;">Finalizar Registro</button>
            </form>
        </div>
    </section>

    <section id="panel-abonos" class="app-panel">
        <div class="header-app"><span>GESTIÓN FINANCIERA</span><button class="btn-main btn-back" onclick="navegar('home')">Regresar</button></div>
        <div class="card">
            <div class="grid-flex">
                <div class="form-group">
                    <label>Cliente</label>
                    <select id="a-cliente-select" onchange="actualizarInfoAbono()"><option value="">Seleccione...</option></select>
                    <button class="btn-main btn-edit" id="btn-abrir-edit" style="display:none;" onclick="abrirModalEdicion()">Modificar Datos</button>
                </div>
                <div class="form-group"><label>Fecha Abono</label><input type="date" id="a-fecha-pago"></div>
                <div class="form-group"><label>Monto ($)</label><input type="number" id="a-monto" step="0.01"></div>
            </div>
            <button class="btn-main btn-success" style="width:100%;" onclick="registrarAbono()">Registrar Pago y Generar Ticket</button>
            <div id="detalle-abono-container" class="resumen-pago">
                <table class="minimal-table"><tbody id="tabla-detalle-abono"></tbody></table>
            </div>
        </div>
    </section>

    <section id="panel-consulta" class="app-panel">
        <div class="header-app"><input type="text" id="buscador" placeholder="Filtrar registros..." onkeyup="filtrarVentas()"><button class="btn-main btn-back" onclick="navegar('home')">Inicio</button></div>
        <div class="card no-padding">
            <table class="main-table">
                <thead><tr><th>Fecha</th><th>Cliente</th><th>Saldo</th><th>Acciones</th></tr></thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
